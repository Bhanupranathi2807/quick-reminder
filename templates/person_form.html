{% extends "base.html" %}{% block title %}Family Member{% endblock %}{% block content %}
<div class="form-card"><span class="eyebrow">FAMILY PROFILE</span><h1>{{'Edit' if person else 'Add'}} Family Member</h1><form method="post" class="form-grid">
<label>Full Name *<input name="name" required value="{{person.name if person else ''}}"></label><label>Relationship<select name="relation">{% for x in ['Self','Father','Mother','Brother','Sister','Son','Daughter','Spouse','Grandfather','Grandmother','Other'] %}<option {% if person and person.relation==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>
<label>Date of Birth<input type="date" name="date_of_birth" value="{{person.date_of_birth if person else ''}}"></label><label>Gender<input name="gender" value="{{person.gender if person else ''}}"></label><label>Mobile<input name="mobile" value="{{person.mobile if person else ''}}"></label><label>Email<input type="email" name="email" value="{{person.email if person else ''}}"></label><label class="wide">Address<textarea name="address">{{person.address if person else ''}}</textarea></label>
<h2 class="wide">Identity Numbers</h2><label>Aadhaar Number<input name="aadhaar_number" value="{{person.aadhaar_number if person else ''}}"></label><label>PAN Number<input name="pan_number" value="{{person.pan_number if person else ''}}"></label><label>Voter ID<input name="voter_id" value="{{person.voter_id if person else ''}}"></label><label>Driving Licence<input name="driving_licence" value="{{person.driving_licence if person else ''}}"></label><label>Passport Number<input name="passport_number" value="{{person.passport_number if person else ''}}"></label><label>Ration Card Number<input name="ration_card" value="{{person.ration_card if person else ''}}"></label><label class="wide">Other Important ID<input name="other_id" value="{{person.other_id if person else ''}}"></label>
<div class="wide actions"><a class="button" href="{{url_for('dashboard')}}">Cancel</a><button class="primary">Save Details</button></div></form></div>{% endblock %}
