{% extends "base.html" %}{% block title %}Edit Document{% endblock %}{% block content %}
<div class="form-card"><span class="eyebrow">DOCUMENT</span><h1>Edit Document</h1><p>{{doc.original_name}}</p><form method="post" class="form"><label>Type<select name="document_type">{% for x in doc_types %}<option {% if doc.document_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Document Number<input name="document_number" value="{{doc.document_number}}"></label><div class="actions"><a class="button" href="{{url_for('person_detail',person_id=doc.person_id)}}">Cancel</a><button class="primary">Save</button></div></form></div>{% endblock %}
