{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="auth"><div class="auth-card"><span class="eyebrow">NEW ACCOUNT</span><h1>Create your account</h1><p>After registration you can add and manage your whole family.</p>
<form method="post" class="form"><label>Full Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Mobile Number<input name="mobile" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Confirm Password<input type="password" name="confirm_password" required></label><button class="primary big">Register</button></form><p>Already have an account? <a href="{{url_for('login')}}">Login</a></p></div></div>{% endblock %}
