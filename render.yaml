services:
  - type: web
    name: quick-reminder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quick-reminder-db
          property: connectionString

databases:
  - name: quick-reminder-db
    plan: free
    databaseName: quick_reminder
    user: quick_reminder_user
    postgresMajorVersion: "17"
